<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블루 아카이브 학생 선호도 등급 분류기</title>
  <link rel="stylesheet" href="style.css">
  <!-- [수정] 오류가 많은 html2canvas 대신 안정적인 최신 html-to-image 라이브러리 사용 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
</head>
<body>
  <div class="tape-deco-left"></div>
  <div class="app-container">
    <header class="hud-bar">
      <div class="brand-title">
        BLUE ARCHIVE <span>TIER SORTER</span>
      </div>
      <div class="hud-controls">
        <div class="hud-stat-box recruit-box skew-box">
          <div class="skew-inner">
            <span class="hud-stat-text">선택 횟수 <span id="comparisonText" class="hud-tag">0 / 0회</span></span>
          </div>
        </div>
        <div class="hud-stat-box recruit-box skew-box">
          <div class="skew-inner">
            <span class="hud-stat-text">진행도 <span id="progressText" class="hud-tag">0%</span></span>
          </div>
        </div>
        
        <button id="btnSkipTest" class="btn-skew-action skew-box" style="background: #f04e4e; color: #fff;">
          <div class="skew-inner btn-text">테스트 스킵</div>
        </button>
        
        <button id="btnOpenSettings" class="btn-skew-action skew-box">
          <div class="skew-inner btn-text">설정</div>
        </button>
      </div>
    </header>

    <div class="classifier-wrapper">
      <section id="questionSection" class="question-panel">
        <div class="progress-capsule">
          <div class="progress-fill" id="progressFill"></div>
          <span class="progress-percent" id="progressPercentText">0%</span>
        </div>
        <div class="question-header">
          <div id="phaseTitle" class="question-guide">선호하는 학생 2명을 순서대로 선택해주세요.</div>
          <div id="poolSizeTag" class="hud-tag">후보 10명</div>
        </div>
        <div id="choiceGrid" class="choice-grid grid-cols-5"></div>
        <div class="action-row">
          <button id="btnSubmit" class="btn-skew-action skew-box btn-primary">
            <div class="skew-inner btn-text">선택 확정</div>
          </button>
        </div>
      </section>

<!-- 최종 결과 영역 -->
      <section id="resultSection" class="result-view">
        <div id="captureArea" class="capture-container"></div>
        
        <!-- [수정] 2가지 다운로드 모드 버튼 제공 -->
        <div class="action-row" style="justify-content: center; margin-top: 20px; gap: 12px; flex-wrap: wrap;">
          <button id="btnDownloadImg" class="btn-skew-action skew-box btn-primary" style="padding: 0 24px; height: 48px; min-width: 180px;">
            <div class="skew-inner btn-text" style="font-size: 14.5px;">표준 이미지 저장</div>
          </button>
          
          <button id="btnDownloadImgLarge" class="btn-skew-action skew-box btn-primary" style="background: #f59e0b; padding: 0 24px; height: 48px; min-width: 180px;">
            <div class="skew-inner btn-text" style="font-size: 14.5px;">큰 아이콘 저장 (가로 10명)</div>
          </button>
        </div>
      </section>
    </div>
  </div>

  <div id="settingsModal" class="modal-overlay">
    <div class="note-modal">
      <div class="binder-clip"></div>
      <div class="modal-header-section">
        <div class="doc-meta">SYSTEM CONFIGURATION</div>
        <div class="modal-title">분류 조건 설정</div>
        <div class="modal-subtitle">평가 대상 학생 풀을 설정하면 필요 선택 횟수가 자동 계산됩니다.</div>
      </div>
      <div class="modal-body-section">
        <div class="options-checklist">
          <label class="checklist-item">
            <input type="checkbox" id="optVariant">
            <div class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div><div class="item-title">이격(의상) 학생 포함</div><div class="item-desc">수영복, 새해, 드레스 등 이격 버전을 포함합니다.</div></div>
          </label>
          <label class="checklist-item">
            <input type="checkbox" id="optUnreleased">
            <div class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div><div class="item-title">미실장 학생 포함</div><div class="item-desc">스토리/NPC로만 등장한 미실장 학생을 포함합니다.</div></div>
          </label>
          <label class="checklist-item">
            <input type="checkbox" id="optServerJp">
            <div class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div><div class="item-title">JP 서버 기준</div><div class="item-desc">체크 시 일본 서버, 미체크 시 한국 서버 실장 기준을 적용합니다.</div></div>
          </label>
        </div>
        <div class="count-preview-box">
          <div>분류 대상 학생: <strong id="previewCount">0</strong>명</div>
          <div style="margin-top: 4px; font-size: 11.5px; color: var(--ba-text-sub);">
            예상 필요 선택 횟수: <strong id="previewMaxComp" style="color: var(--ba-blue-dark); font-size: 14px;">0</strong>회
          </div>
        </div>
        <div class="action-row" style="margin-top: 10px; display: flex; gap: 8px;">
          <button id="btnCloseSettings" class="btn-skew-action skew-box" style="flex: 1; background: #eef2f6; color: #475569;">
            <div class="skew-inner btn-text" style="justify-content: center;">돌아가기</div>
          </button>
          <button id="btnStart" class="btn-skew-action skew-box btn-primary" style="flex: 2;">
            <div class="skew-inner btn-text" style="justify-content: center;">설정 적용 및 시작</div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="students.js"></script>
  <script src="app.js"></script>
</body>
</html>
